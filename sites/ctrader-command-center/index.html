<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSFX Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="noise"></div>
  <div id="scanlines"></div>
  <div id="toast-container"></div>

  <div id="app" class="app-shell">
    <header class="top-bar glass-panel">
      <div class="brand">
        <span class="brand-mark">//</span>
        <div>
          <h1 class="brand-title">SSFX</h1>
          <span class="brand-sub">COMMAND CENTER</span>
        </div>
      </div>
      <nav class="main-nav" id="main-nav"></nav>
      <div class="status-pill" id="connection-pill">
        <span class="dot" id="connection-dot"></span>
        <span id="connection-text">OFFLINE</span>
      </div>
    </header>

    <main id="main-stage" class="main-stage"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.1/dist/iife/bundle.js"></script>
  <script type="module" src="config.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/components/signal-source.js"></script>
  <script type="module" src="js/components/agent-pipeline.js"></script>
  <script type="module" src="js/components/slave-fleet.js"></script>
  <script type="module" src="js/components/account-editor.js"></script>
  <script type="module" src="js/components/presets.js"></script>
  <script type="module" src="js/components/signal-injector.js"></script>
  <script type="module" src="js/components/terminal.js"></script>
  <script type="module" src="js/components/market-context.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
