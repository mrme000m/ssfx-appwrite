name: Deploy SSFX Appwrite Auth

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
  APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
  APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}

jobs:
  deploy-tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Appwrite CLI
        run: npm install -g appwrite@22.3.0
      - name: Login
        run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Push Tables
        run: appwrite push tables --all --force

  deploy-functions:
    needs: deploy-tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Appwrite CLI
        run: npm install -g appwrite@22.3.0
      - name: Login
        run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Sync shared module
        run: python3 dev/scripts/sync_shared.py
      - name: Lint
        run: bash dev/scripts/lint.sh
      - name: Deploy functions
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SESSION_HMAC_KEY: ${{ secrets.SESSION_HMAC_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
        run: |
          python3 dev/scripts/deploy_auth.py \
            --functions --no-tables --no-site --no-domains --no-smoke \
            --no-sync --no-lint

  deploy-site:
    needs: deploy-tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Appwrite CLI
        run: npm install -g appwrite@22.3.0
      - name: Login
        run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Deploy site
        env:
          V2_ADMIN_KEY: ${{ secrets.V2_ADMIN_KEY }}
          DATA_SERVICE_API_KEY: ${{ secrets.DATA_SERVICE_API_KEY }}
          AGENT_HARNESS_BASE: ${{ secrets.AGENT_HARNESS_BASE }}
        run: |
          python3 dev/scripts/deploy_auth.py \
            --site --no-tables --no-functions --no-domains --no-smoke \
            --no-sync --no-lint

  verify-domains:
    needs: [deploy-functions, deploy-site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Appwrite CLI
        run: npm install -g appwrite@22.3.0
      - name: Login
        run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Verify custom domains
        run: python3 dev/scripts/setup_function_domains.py --status

  smoke-test:
    needs: [deploy-functions, deploy-site]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          set -euo pipefail
          echo "[ci] Smoke testing deployed endpoints..."
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 --connect-timeout 10 \
            'https://auth.mrme.tech/session' | tee /tmp/session.json
          test "$(jq -r '.authenticated' /tmp/session.json)" = "false"
          echo "  ✓ /session returns authenticated=false"
          curl -fsS --retry 5 --retry-delay 5 --connect-timeout 10 \
            'https://app.mrme.tech/' | tee /tmp/site.html
          grep -q '<div id="app">' /tmp/site.html
          echo "  ✓ site HTML returned"
          echo "[ci] Smoke tests passed."

  cleanup:
    needs: [deploy-functions, deploy-site]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Appwrite CLI
        run: npm install -g appwrite@22.3.0
      - name: Login
        run: appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$APPWRITE_PROJECT_ID" --key "$APPWRITE_API_KEY"
      - name: Cleanup orphaned resources
        run: python3 dev/scripts/cleanup_appwrite_resources.py
        continue-on-error: true
