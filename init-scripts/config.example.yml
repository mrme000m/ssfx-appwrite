# Example configuration for third-party service init scripts.
# Copy this file to config.yml and fill in real values.
# config.yml is gitignored; do not commit secrets.

ctrader:
  client_id: "your-ctrader-client-id"
  client_secret: "your-ctrader-client-secret"
  redirect_uri: "https://auth.mrme.tech/callback"
  environment: "demo" # or "live"

pplx_agent:
  mode: "pro"
  model: "GPT-5.5"
  thinking: true
  # Set this after running `./dev.sh pplx-agent setup`:
  # gold_market_space_uuid: ""

master:
  email: "admin@example.com"

# Add more services below as needed:
# example_service:
#   api_key: "..."
#   endpoint: "..."
