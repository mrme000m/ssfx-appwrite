[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; -----------------------------------------------------------------------------
; Dataservice daemon — cTrader market-data ingestion and control plane
; -----------------------------------------------------------------------------
[program:dataservice-daemon]
command=/usr/local/bin/run-dataservice-daemon
autostart=true
autorestart=true
stdout_logfile=/app/logs/dataservice-daemon.log
stderr_logfile=/app/logs/dataservice-daemon.log

; -----------------------------------------------------------------------------
; Dataservice MCP SSE server — tools/live prices for MCP clients
; -----------------------------------------------------------------------------
[program:dataservice-sse]
command=/usr/local/bin/run-dataservice-sse
autostart=true
autorestart=true
stdout_logfile=/app/logs/dataservice-sse.log
stderr_logfile=/app/logs/dataservice-sse.log

; -----------------------------------------------------------------------------
; Dataservice OpenPI REST API + admin UI
; -----------------------------------------------------------------------------
[program:dataservice-api]
command=/usr/local/bin/run-dataservice-api
autostart=true
autorestart=true
stdout_logfile=/app/logs/dataservice-api.log
stderr_logfile=/app/logs/dataservice-api.log

; -----------------------------------------------------------------------------
; ssfx-server — Telegram webhook signal receiver and cTrader follower admin
; -----------------------------------------------------------------------------
[program:ssfx-server]
command=/usr/local/bin/run-ssfx-server
autostart=true
autorestart=true
stdout_logfile=/app/logs/ssfx-server.log
stderr_logfile=/app/logs/ssfx-server.log

; -----------------------------------------------------------------------------
; ctrader — unified cTrader service (market data WS hub + trade execution)
; -----------------------------------------------------------------------------
[program:ctrader]
command=/usr/local/bin/run-ctrader
autostart=true
autorestart=true
stdout_logfile=/app/logs/ctrader.log
stderr_logfile=/app/logs/ctrader.log

; -----------------------------------------------------------------------------
; account-hub — persistent cTrader connections for all slave accounts
; (WS server for real-time account data: positions, orders, balance)
; -----------------------------------------------------------------------------
[program:account-hub]
command=/usr/local/bin/run-account-hub
autostart=true
autorestart=true
stdout_logfile=/app/logs/account-hub.log
stderr_logfile=/app/logs/account-hub.log

; -----------------------------------------------------------------------------
; agent-harness — AI decision layer for XAUUSD intent, entry, and lifecycle
; -----------------------------------------------------------------------------
[program:agent-harness]
command=/usr/local/bin/run-agent-harness
autostart=true
autorestart=true
stdout_logfile=/app/logs/agent-harness.log
stderr_logfile=/app/logs/agent-harness.log

; ------------------------------------------------------------------------------
; pplx-agent — Perplexity + TradingView + quant long-term gold market research
; ------------------------------------------------------------------------------
[program:pplx-agent]
command=/usr/local/bin/run-pplx-agent
autostart=true
autorestart=true
stdout_logfile=/app/logs/pplx-agent.log
stderr_logfile=/app/logs/pplx-agent.log
